# What is left of the pipeline's settings file: where each model's weights are.
#
# A run's choices are the job's variables, listed at the top of entrypoint.sh and checked there. The
# values the code was tuned to are constants beside the code that uses them, and what an engine is
# started with is in the model's registration (models/registry.py). What describes the documents is in
# config/field_definitions.yaml and prompts/.

bootstrap:
  model:
    # The model a task loads when it is handed none. One of the names registered in models/registry.py.
    type: gemma4-31b-w4a16-vllm
    # The folder of each model's weights.
    default_paths:
      gemma4-31b-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
      gemma4-12b-unified-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
