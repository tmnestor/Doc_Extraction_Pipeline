# The pipeline's settings.
#
# Everything a run is set to do that is not one of the job's variables (README, "What a job may set") is
# here. Nothing is defaulted in Python: a key the code needs and does not find stops the run, and so does
# a key the code does not know.
#
# This file says what is set and what each setting does. How each value was arrived at (the measurements,
# the values tried and rejected) is in the evaluation repository's decisions notes, and in this file's own
# history before 24 November 2026.

# What is needed before any work begins: the model, the cards and the log.
bootstrap:
  model:
    # The model a task loads when the job names none. One of the names registered in models/registry.py.
    type: gemma4-31b-w4a16-vllm
    # null = the folder default_paths gives for the model in use. A path here is used only for the model
    # named in `type` above, so that one model's weights are never loaded under another's name.
    path: null
    # false = the engine compiles CUDA graphs when it starts: a slower start and faster reading, which
    # is the right trade for a run of more than a few pages. true skips the compiling.
    enforce_eager: false
    # none = the model's own chat template. Otherwise the path of a *.jinja file to use in its place: the
    # last resort for a model whose template thinks by default and ignores enable_thinking.
    chat_template: none
    # The folder of each model's weights.
    default_paths:
      gemma4-31b-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
      gemma4-12b-unified-w4a16-vllm: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
  gpus:
    num_gpus: 0                # 0 = every card that can be seen; N = use N cards
    data_parallel_size: null   # null = one engine on each card, for a model that fits on one
  logging:
    # Where the entry script writes its log when the job does not set DOC_EXTRACT_LOG_DIR. Null as
    # shipped: a job that sets neither is stopped and told what to set, where a folder named here would
    # be one machine's, and a run that forgot its own would write into it.
    log_dir: null


# The vLLM engine's settings for each model, and the trace of what is sent to it. There is no setting
# for sampling: every request is decoded greedily (temperature 0), which is fixed where the request is
# made (models/backends/vllm_backend.py) so that a difference between two runs is never the sampler's.
# Completion budgets are pipeline.token_budgets, below.
inference:

  vllm:
    # What a model with no block of its own under `models` is given.
    defaults:
      gpu_memory_utilization: 0.90
      max_model_len: 8192
      max_num_seqs: 1
      limit_mm_per_prompt: 1
      enable_prefix_caching: true
    # A block for each registered model, under its full name. Each key:
    #   max_model_len            the longest request and reply together, in tokens
    #   gpu_memory_utilization   the share of each card's memory the engine may take
    #   limit_mm_per_prompt      images in a request. Always 1: a page is one image
    #   max_num_seqs             requests the engine runs at once. It is the ceiling on what the batch
    #                            sizes under pipeline.batching can achieve: raise both or neither moves
    #   enable_prefix_caching    reuse the engine's work on the part of a prompt shared with the last
    #   mm_processor_kwargs      the image token budget asked of the model's processor. Gemma 4 takes
    #                            70, 140, 280, 560 or 1120; 560 is the measured best for both models
    #                            (280 loses small print, 1120 is far worse), so it is not to be raised
    #   hf_overrides             the same budget as the model's own configuration names it. The two
    #                            models name it differently, and it MUST equal max_soft_tokens: a
    #                            test checks that they agree
    #   stage_overrides          optional: settings one stage loads differently. Only classify takes
    #                            them, and only for keys the model's own block states
    models:
      # One engine split across both cards (tp=2): its weights, 21.67 GiB, do not fit on one L4.
      gemma4-31b-w4a16-vllm:
        max_model_len: 8192
        gpu_memory_utilization: 0.90
        limit_mm_per_prompt: 1
        # 16 is where the gain stops: the engine's cache holds about 16 bank statements at once.
        max_num_seqs: 16
        enable_prefix_caching: true
        mm_processor_kwargs:
          max_soft_tokens: 560
        hf_overrides:
          vision_soft_tokens_per_image: 560
          vision_config:
            default_output_length: 560
        # Stated at 560, the same as extraction, so it changes nothing as shipped. At 280 the classify
        # stage was faster and kept every type on clean pages; it has not been measured on photographs.
        # The three values must move together.
        stage_overrides:
          classify:
            mm_processor_kwargs:
              max_soft_tokens: 560
            hf_overrides:
              vision_soft_tokens_per_image: 560
              vision_config:
                default_output_length: 560
      # One whole engine on each card: its weights, 9.56 GiB, fit on one L4.
      gemma4-12b-unified-w4a16-vllm:
        max_model_len: 16384         # vLLM recipe recommends 16384-32768 for this model
        gpu_memory_utilization: 0.90
        limit_mm_per_prompt: 1
        max_num_seqs: 10
        enable_prefix_caching: true
        mm_processor_kwargs:
          max_soft_tokens: 560
        # This model names the budget vision_config.num_soft_tokens. The 31B's names set nothing here.
        hf_overrides:
          vision_config:
            num_soft_tokens: 560
  # A record of every prompt sent to the model and every reply, one JSON object a line, with the keys
  # image_name, pipeline, label, model, prompt, raw_response, prompt_tokens, completion_tokens.
  tracing:
    raw_prompts: false   # true = keep the record
    path: none           # none = <output folder>/raw_prompt_trace.jsonl; or a path

# What each task does.
pipeline:
  # The folders of split, classify, extract, clean and evaluate, when the job does not set them
  # (image_dir, ground_truth, output). All three are null as shipped: a task that needs one and is given
  # none is stopped and told what to set. A folder named here would be one machine's, and a run that
  # forgot to name its own would read it, or write into it, without a word.
  information_extraction:
    input:
      # The folder of pages. Absolute, and not beginning with ~: nothing expands it.
      dir: null
      # The answer key, a JSON lines file, for evaluate. It MUST be the key of the folder of pages above:
      # file names repeat from one set to another, so the wrong key still gives plausible scores.
      ground_truth: null
      # Applied by the classify stage when it lists the folder. Both are null as shipped: a value left
      # from a short trial would make a later run read fewer pages than intended.
      max_images: null       # null = every page; N = the first N
      document_types: null   # null = every page; a list keeps the pages whose file name holds one
    output:
      # Where the tasks write. A folder belongs to one run: a task carries on from what it holds, and
      # refuses to carry on from another model's, folder of pages' or commit's (run_manifest.json).
      dir: null

  # The SROIE benchmark (KFP_TASK=sroie): 347 public receipts, four fields each. It has its own data,
  # prompt, scorer and output folder, and reads only this block.
  sroie:
    # The split's own folder, the one that holds img/ and entities/.
    data_dir: /home/jovyan/nfs_share/tod_2026/data/sroie/test
    # One folder for each model: the task does not resume, and writes over its two files every time.
    output_dir: /home/jovyan/nfs_share/tod_2026/data/sroie/output_gemma4
    max_new_tokens: 256        # the longest reply: four short fields
    batch_size: 8              # receipts to an engine call; the ceiling is the model's max_num_seqs

  classification:
    fallback_type: UNIVERSAL     # the type of a page whose classification reply cannot be read

  # How many pages go to the engine in one call. A page is one independent request, so the engine runs
  # up to the model's max_num_seqs of a call's pages at once; a size of 1 is one call a page. A call
  # holds pages of one document type, since a type has its own prompt and completion budget. A call
  # that fails is tried again one page at a time, so a size too large costs time and never a result.
  batching:
    classify: 64               # pages to a classify call. Not a document type
    receipt: 10
    invoice: 10
    # A statement is one independent request, like any other page, and shares a call with others. The
    # size is several times max_num_seqs, so that the engine stays full as the short statements finish.
    bank_statement: 64
    sroie_receipt: 8           # the receipts of the SROIE dataset: four short fields each
    default: 10                # a type with no size of its own

  processing:
    verbose: false             # true = the classify stage prints each page's type as it is detected
    # A page that fails among pages that are answered is recorded with its error, and the stage goes
    # on. When this many requests in a row have failed with none answered between them, the engine
    # has stopped answering, or a setting makes every page fail, and the stage stops with its reason.
    # What it had read is kept, and the next run carries on from there.
    stop_after_failed_requests: 8

  # Completion budgets: the most tokens a reply may run to. The same for every model, so that a
  # comparison of two models is not one of two budgets: a model given fewer tokens can be cut off
  # part way through the dense table of a bank statement.
  #   classify            the reply to the classification prompt
  #   extract_base        a page's fields: this many tokens ...
  #   extract_per_field   ... and this many more for each field of its document type
  # A document type with `completion_tokens` in config/field_definitions.yaml has that fixed budget
  # in place of the two extract numbers.
  token_budgets:
    classify: 150
    extract_base: 512
    extract_per_field: 64

  # The split stage (KFP_TASK=split), which runs before classify on photographs. It asks the model where
  # each receipt is, cuts a photograph of several into one image for each, and straightens an image
  # whose rows of print drift far enough to mislead a reader. The later tasks then read
  # <output>/split/images. The rules are in common/photo_split.py. Every key is required.
  photo_split:
    # false = every photograph is copied through unchanged and the model is not loaded.
    enabled: false
    # The question put to the model. The reply read is a JSON list of {"box_2d": [ymin, xmin, ymax,
    # xmax]} on a 0 to 1000 scale.
    prompt: |
      Detect every paper receipt in this photograph. Reply with JSON only: a list with one object for each receipt, in the form {"box_2d": [ymin, xmin, ymax, xmax], "label": "receipt"}, where the four numbers are normalised to 0-1000.
    max_tokens: 400            # the longest reply; a box takes about 30 tokens
    batch_size: 16             # photographs to an engine call
    # Each cut image is this much larger than its box on every side, as a share of the box's width and
    # height, and never past the halfway line to a neighbour.
    margin_frac: 0.10
    min_box_frac: 0.01         # a box covering less than this share of the photograph is ignored
    # The reply is not trusted, and the photograph is copied through, when two boxes share more than
    # max_overlap_frac of the smaller one, or there are more than max_receipts boxes.
    max_overlap_frac: 0.10
    max_receipts: 12
    # Whether an image is turned so that its rows of print run level. A model follows a row across a
    # wide gap far less well on a turned page.
    straighten: true
    straighten_min_deg: 1.0    # a smaller turn is left alone
    straighten_max_deg: 15.0   # a larger turn is not believed, and the image is left alone
    # An image is turned or rectified only when its rows drift at least this many text heights off their
    # own line across the width of the print. 0 acts on every image.
    straighten_min_drift_heights: 2.0
    straighten_fill_rgb: [255, 255, 255]   # the colour of the corners a turned image gains
    # Turning removes tilt and not foreshortening. A photograph of one document is first tried for
    # rectification: its four corners are found and the view from an angle reversed. It is done only
    # when the corners can be trusted: one sheet found, covering at least rectify_min_area_frac of the
    # photograph, with at least rectify_min_edges of its four edges confirmed by a sharp step, and
    # holding at least rectify_min_print_frac of the photograph's print. Otherwise the photograph is
    # turned. Both need straighten: true.
    rectify_pages: true        # a photograph of one document
    rectify_pieces: true       # each image cut from a photograph of several
    rectify_min_area_frac: 0.30
    rectify_min_edges: 4
    rectify_min_print_frac: 0.98
    # The corners are looked for by the desk method first, which needs a desk that is smooth and of one
    # colour. true = a photograph it gives no trusted sheet for is tried with the paper method, which
    # works on a textured or pale surface. Its sheet must pass the same tests and agree with its own
    # quadrilateral by at least rectify_paper_min_fit.
    rectify_paper_model: true
    rectify_paper_min_fit: 0.97

    # The sheet finder (common/sheet_finder.py, read by common/sheet_finder_config.py): finding print,
    # the direction of its rows, and a sheet's four corners. Lengths in pixels are on the working copy
    # unless they say otherwise. Every value is above zero but ransac_seed.
    finder:
      # The sheets are separated on a copy shrunk to this long edge; corners are refined at full size.
      work_long_edge: 1600

      # Desk: modelled from the frame's outer ring (a share of the short edge). A pixel is not desk when
      # its colour is further from the desk than both a fixed distance in grey levels and a multiple of
      # the desk's own noise.
      desk_ring_frac: 0.03
      mask_min_distance: 14.0
      mask_noise_multiple: 5.0

      # Shadow: the desk darkened without a change of hue, down to this share of its lit brightness. A
      # shadow counts as desk only this close to lit desk, in text heights (or, where a photograph
      # shows no print, as a share of the long edge). Further in, that colour is shaded paper.
      shadow_min_factor: 0.5
      shadow_reach_heights: 4.5
      shadow_reach_frac: 0.03

      # Sharp steps: a change of at least step_min grey levels over step_span_px, after a light blur. A
      # paper edge is one; a shadow's edge is not. Specks smaller than step_min_area_px are noise. Gaps
      # in an edge up to about twice edge_gap_close_px are bridged, and edges are thickened by
      # edge_seal_px.
      blur_sigma_px: 1.0
      step_span_px: 3
      step_min: 9.0
      step_min_area_px: 12
      edge_gap_close_px: 4
      edge_seal_px: 1

      # A sheet must cover at least this share of the frame.
      min_region_frac: 0.01

      # Coarse edges: four lines fitted to the sheet's outline. A point supports a line within
      # outline_tolerance_px; a line needs points along this share of the sheet's shorter side; and two
      # lines must run within text_agree_deg of the rows of print, the other two within twice that of
      # square to them.
      outline_tolerance_px: 2.0
      min_outline_edge_frac: 0.25
      text_agree_deg: 10.0

      # Refined edges, at full size: each edge is walked from outside the sheet inwards to the first
      # sharp step, twice. Reaches are shares of the sheet's diagonal. An edge is moved only if this
      # share of it shows a step.
      refine_outside_first_frac: 0.02
      refine_inside_first_frac: 0.06
      refine_outside_final_frac: 0.01
      refine_inside_final_frac: 0.02
      edge_tolerance_px: 2.0
      min_edge_support: 0.35

      # Print: a pixel darker than its mark_block_px neighbourhood (an odd number) by mark_darker_by
      # grey levels. A mark longer than mark_max_heights text heights is not print.
      mark_block_px: 31
      mark_darker_by: 14.0
      mark_max_heights: 5.0

      # Direction of the rows of print, by a least-squares line through each row. The letters of a row
      # are joined sideways over text_join_heights into one strip; a strip is a row when it is at least
      # text_min_row_heights long and no more than text_max_row_thickness_heights thick (all in text
      # heights); the direction is given when at least text_min_rows rows are found.
      text_join_heights: 1.5
      text_min_row_heights: 4.0
      text_max_row_thickness_heights: 2.5
      text_min_rows: 5

      # Seed for the line fits, so that a photograph always gives the same corners.
      ransac_seed: 0

      # The drift of the print is measured with this percentile of the rows' angles, ranked by size and
      # weighted by length: on a page seen at a slant it is the steep rows that drift.
      drift_row_percentile: 60.0

      # The paper method. The area inside a block of print is paper for certain; cv2.grabCut, seeded
      # with it, learns the paper's colours and the surroundings' from the photograph.
      paper_work_long_edge: 800
      paper_rounds: 5
      # Letters and rows this many text heights apart, or closer, are one block of print.
      paper_join_heights: 3.0
      # The frame's outer ring, as a share of its short edge, is surroundings for certain.
      paper_border_frac: 0.01
      # A page that fills the frame has no surroundings: when that ring is within this colour difference
      # (CIE Lab) of the paper under the print, the method stops at once.
      paper_min_border_difference: 3.0
      # With a box from the model, only the box and the print it claims are looked at, grown on every
      # side by paper_region_grow_frac. The box claims a block of print it covers at least
      # paper_block_in_box_min of, and that is at least paper_block_min_share of the largest.
      paper_region_grow_frac: 0.35
      paper_block_in_box_min: 0.5
      paper_block_min_share: 0.02
      # The sheet may be continued along its own edges, to take in blank paper beyond the print. The
      # longer sheet is kept when it and its quadrilateral agree at least this well.
      paper_extension_min_fit: 0.97
      # Each edge is placed at full size at the first sharp step met walking out from inside the sheet.
      # The walk runs this far outside the coarse edge and starts this far inside it, as shares of the
      # diagonal.
      paper_refine_outside_frac: 0.02
      paper_refine_inside_frac: 0.01

  # The order the extract stage reads the document types in, so that pages of one type follow one
  # another and the engine can reuse its work on their prompt. A type not listed is read last.
  extraction:
    order:
      - bank_statement
      - invoice
      - receipt
    secondary_sort: none              # within a type: none | image_area_asc | image_area_desc
    # Types that are not read at all. A page of one is written as a skipped record.
    skip_labels: []

resources:
  infrastructure:
    # How long to wait for a finished worker's process to end, in seconds. There is no limit on the
    # work itself.
    dp_join_timeout: 60
