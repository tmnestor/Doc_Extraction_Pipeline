# What the pipeline knows about documents: the document types, their fields, and the scoring thresholds.
#
# A DOCUMENT TYPE IS A BLOCK HERE AND A PROMPT OF THE SAME NAME in prompts/extraction_prompts.yaml.
# Nothing in Python names a type or a field. To add a type, add its block and its prompt, and an entry
# under `fields:` for each field no other type already has; to have pages classified as it, add a rule
# to prompts/document_type_detection.yaml.
#
# A type's block holds:
#   fields             the fields its prompt asks for, which are the fields it is scored on
#   also_called        optional: other names a reply may give the type in its DOCUMENT_TYPE field;
#                      each is settled to the type's own name when the reply is cleaned
#   completion_tokens  optional: a fixed completion budget for a page of this type. Without it the
#                      budget is worked out from the number of fields
#   table              optional: for a type whose list fields are the columns of one table, an entry
#                      a row. Before scoring, on each side, the rows marked NOT_FOUND in the column
#                      `rows_absent_where_not_found_in` are dropped, and the rows are put in the date
#                      order of the column `rows_in_date_order_of`. Either key may be left out

document_types:
  invoice:
    also_called:
      - invoice
      - tax invoice
      - bill
      - estimate
      - quote
      - quotation
      - proforma invoice
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  receipt:
    also_called:
      - receipt
      - purchase receipt
      - sales receipt
      - transaction receipt
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  bank_statement:
    also_called:
      - statement
      - bank statement
      - account statement
      - credit card statement
    # A statement's reply is one long table, so its budget is fixed, not worked out from five fields.
    completion_tokens: 4096
    # The answer key holds every row and marks a credit with NOT_FOUND in the paid column; the
    # prompt asks for debits only. One side may list rows as printed and the other by date.
    table:
      columns:
        - TRANSACTION_DATES
        - TRANSACTION_AMOUNTS_PAID
        - TRANSACTION_AMOUNTS_RECEIVED
        - LINE_ITEM_DESCRIPTIONS
        - ACCOUNT_BALANCE
      rows_absent_where_not_found_in: TRANSACTION_AMOUNTS_PAID
      rows_in_date_order_of: TRANSACTION_DATES
    fields:
      - DOCUMENT_TYPE
      - STATEMENT_DATE_RANGE
      - LINE_ITEM_DESCRIPTIONS
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID

  travel:
    also_called:
      - travel
      - travel expense
      - travel_expense
      - boarding pass
      - airline ticket
      - e-ticket
      - train ticket
      - bus ticket
      - taxi receipt
      - rideshare receipt
      - itinerary
      - flight ticket
    fields:
      - DOCUMENT_TYPE
      - PASSENGER_NAME
      - TRAVEL_MODE
      - TRAVEL_ROUTE
      - TRAVEL_DATES
      - INVOICE_DATE
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - SUPPLIER_NAME

  logbook:
    also_called:
      - logbook
      - vehicle logbook
      - vehicle_logbook
      - motor vehicle logbook
      - car logbook
      - mileage log
      - trip log
      - ato logbook
    fields:
      - DOCUMENT_TYPE
      - VEHICLE_MAKE
      - VEHICLE_MODEL
      - VEHICLE_REGISTRATION
      - ENGINE_CAPACITY
      - LOGBOOK_PERIOD_START
      - LOGBOOK_PERIOD_END
      - ODOMETER_START
      - ODOMETER_END
      - TOTAL_KILOMETERS
      - BUSINESS_KILOMETERS
      - BUSINESS_USE_PERCENTAGE
      - JOURNEY_DATES
      - JOURNEY_DISTANCES
      - JOURNEY_PURPOSES

  universal:
    # The type of a page whose classification reply cannot be read: every type's fields.
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - STATEMENT_DATE_RANGE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID
      - PASSENGER_NAME
      - TRAVEL_MODE
      - TRAVEL_ROUTE
      - TRAVEL_DATES
      - VEHICLE_MAKE
      - VEHICLE_MODEL
      - VEHICLE_REGISTRATION
      - ENGINE_CAPACITY
      - LOGBOOK_PERIOD_START
      - LOGBOOK_PERIOD_END
      - ODOMETER_START
      - ODOMETER_END
      - TOTAL_KILOMETERS
      - BUSINESS_KILOMETERS
      - BUSINESS_USE_PERCENTAGE
      - JOURNEY_DATES
      - JOURNEY_DISTANCES
      - JOURNEY_PURPOSES

  # The receipts of the public SROIE test split: four fields, each of a kind the pipeline has, and a
  # fixed budget, since a reply is four short lines. Their pages are not classified by a rule: the
  # dataset says what they are (pipeline.datasets in config/run_config.yml).
  sroie_receipt:
    completion_tokens: 256
    fields:
      - COMPANY
      - DATE
      - ADDRESS
      - TOTAL

# The fields. Every field a document type names has an entry here, and nothing in Python names a field.
#
#   cleaned_as  how a value in a reply is tidied, so that one answer written two ways compares as the
#               same. For a list it is how each entry is tidied.
#                 text               markdown stars, doubled spaces and a trailing comma removed
#                 money              "each" removed, a currency's name made "$", commas removed, "$" in front
#                 amount_as_written  kept as text, with its sign and commas; in a list, two amounts with
#                                    only a space between them are two entries
#                 quantity           the "x" or "EACH" beside a count removed
#                 date               spaces round the separators removed
#                 day_month_year     written as DD/MM/YYYY, day before month
#                 identifier         its label ("ABN 12 345...") removed, an 11-digit one without spaces
#                 address            commas, and a telephone number or email address added to it, removed
#                 document_type      settled to the type's own name, from any name it goes by
#   list        true for a field that holds several entries, written with " | " between them
#   scored_as   how a value is compared with the answer. A list is compared entry by entry.
#                 text        one value earns its likeness to the answer, and nothing below a half;
#                             an entry of a list is right if its words match
#                 money       right if the amounts are equal, within the tolerance below
#                 date        one date earns part credit for a near miss; an entry of a list is right
#                             if it is the same day
#                 yes_no      right if both say yes or both say no
#                 identifier  right if the same once its label, spaces, dashes and case are set aside
#   scored_row_by_row  optional, true for a list that is a column of a table. Each entry is compared
#               as its kind and is right or wrong, and text must be nearly letter for letter the same,
#               because the question is whether it is the same row
#   single_value_scored_as  optional: how the field is compared when it holds one value and not a list,
#               where that differs from scored_as
#   also_written  optional: other spellings of the field's name that a reply may use
#
# Two fields of the vehicle logbook are as the code has always treated them, when it went by their
# names, and look wrong. They are left until there is a set of logbooks to measure a correction on.
#   TOTAL_KILOMETERS   cleaned as money, because its name holds TOTAL, so its thousands comma is
#                      removed, while BUSINESS_KILOMETERS is cleaned as text and keeps its comma.
#                      Neither is right: what both want is a plain number, which is not yet a kind
#   LOGBOOK_PERIOD_START, LOGBOOK_PERIOD_END   a single date is compared as text, not as a date
fields:
  DOCUMENT_TYPE:                {cleaned_as: document_type, list: false, scored_as: text}
  BUSINESS_ABN:                 {cleaned_as: identifier, list: false, scored_as: identifier}
  SUPPLIER_NAME:                {cleaned_as: text, list: false, scored_as: text}
  BUSINESS_ADDRESS:             {cleaned_as: address, list: false, scored_as: text}
  PAYER_NAME:                   {cleaned_as: text, list: false, scored_as: text}
  PAYER_ADDRESS:                {cleaned_as: address, list: false, scored_as: text}
  INVOICE_DATE:                 {cleaned_as: day_month_year, list: false, scored_as: date}
  LINE_ITEM_DESCRIPTIONS:
    {cleaned_as: text, list: true, scored_as: text, scored_row_by_row: true, also_written: [LINE_ITEM_DESCRIPTION]}
  LINE_ITEM_QUANTITIES:         {cleaned_as: quantity, list: true, scored_as: text}
  LINE_ITEM_PRICES:             {cleaned_as: money, list: true, scored_as: money}
  LINE_ITEM_TOTAL_PRICES:       {cleaned_as: money, list: true, scored_as: money}
  IS_GST_INCLUDED:              {cleaned_as: text, list: false, scored_as: yes_no}
  GST_AMOUNT:                   {cleaned_as: money, list: false, scored_as: money}
  TOTAL_AMOUNT:                 {cleaned_as: money, list: false, scored_as: money}
  STATEMENT_DATE_RANGE:         {cleaned_as: date, list: false, scored_as: date}
  TRANSACTION_DATES:            {cleaned_as: day_month_year, list: true, scored_as: date, scored_row_by_row: true}
  TRANSACTION_AMOUNTS_PAID:     {cleaned_as: amount_as_written, list: true, scored_as: money, scored_row_by_row: true}
  TRANSACTION_AMOUNTS_RECEIVED: {cleaned_as: amount_as_written, list: true, scored_as: money, scored_row_by_row: true}
  ACCOUNT_BALANCE:              {cleaned_as: text, list: true, scored_as: money, scored_row_by_row: true}
  PASSENGER_NAME:               {cleaned_as: text, list: false, scored_as: text}
  TRAVEL_MODE:                  {cleaned_as: text, list: false, scored_as: text}
  TRAVEL_ROUTE:                 {cleaned_as: text, list: false, scored_as: text}
  TRAVEL_DATES:                 {cleaned_as: date, list: false, scored_as: date, scored_row_by_row: true}
  VEHICLE_MAKE:                 {cleaned_as: text, list: false, scored_as: text}
  VEHICLE_MODEL:                {cleaned_as: text, list: false, scored_as: text}
  VEHICLE_REGISTRATION:         {cleaned_as: text, list: false, scored_as: text}
  ENGINE_CAPACITY:              {cleaned_as: text, list: false, scored_as: text}
  LOGBOOK_PERIOD_START:         {cleaned_as: date, list: false, scored_as: date, single_value_scored_as: text}
  LOGBOOK_PERIOD_END:           {cleaned_as: date, list: false, scored_as: date, single_value_scored_as: text}
  ODOMETER_START:               {cleaned_as: text, list: false, scored_as: text}
  ODOMETER_END:                 {cleaned_as: text, list: false, scored_as: text}
  TOTAL_KILOMETERS:             {cleaned_as: money, list: false, scored_as: text}
  BUSINESS_KILOMETERS:          {cleaned_as: text, list: false, scored_as: text}
  BUSINESS_USE_PERCENTAGE:      {cleaned_as: text, list: false, scored_as: text}
  JOURNEY_DATES:                {cleaned_as: date, list: false, scored_as: date, scored_row_by_row: true}
  JOURNEY_DISTANCES:            {cleaned_as: text, list: false, scored_as: text, scored_row_by_row: true}
  JOURNEY_PURPOSES:             {cleaned_as: text, list: false, scored_as: text}
  COMPANY:                      {cleaned_as: text, list: false, scored_as: text}
  DATE:                         {cleaned_as: day_month_year, list: false, scored_as: date}
  ADDRESS:                      {cleaned_as: address, list: false, scored_as: text}
  TOTAL:                        {cleaned_as: money, list: false, scored_as: money}

# The scoring thresholds.
evaluation:
  # Every threshold the scorer reads (common/scoring.py), and no other: one that nothing reads is
  # refused, since it would look like a setting and change nothing.
  thresholds:
    fuzzy_text_match: 0.75
    monetary_tolerance: 0.01
    # The similarity below which a single text value earns nothing: under it the value is a wrong
    # answer and not a near miss (the ANLS floor).
    anls_threshold: 0.50
    # The score of a date that agrees with the answer in its day and month and not in its year.
    date_day_and_month_only: 0.80
    # The median F1 of its fields at which a page's record says it meets the threshold
    # (meets_threshold). It marks the record and is in no score.
    page_meets_threshold_at: 0.80
    # Edit-distance similarity required to call two TRANSACTION register
    # descriptions the same row. NOT the ANLS 0.50 floor above: that is for
    # partial credit on a scalar answer, whereas this is a boolean "is this the
    # same transaction". Measured on the 55-statement corpus, genuine
    # single-character confusions score 0.94-0.97 ('DO COASTAL CHAR' vs
    # 'DD COASTAL CHAR') while DIFFERENT transactions sharing a prefix reach
    # 0.857 ('BPAY VERRALL REF30033' vs 'BPAY VERRALL REF74032'). 0.90 sits in
    # the gap; anything at or below 0.86 credits the wrong row.
    transaction_text_similarity: 0.90
