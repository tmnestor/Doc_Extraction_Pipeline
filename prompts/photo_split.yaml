# The question the split task puts to the model about each photograph. The reply read is a JSON list
# of {"box_2d": [ymin, xmin, ymax, xmax]} on a 0 to 1000 scale, one object for each receipt.
prompt: |
  Detect every paper receipt in this photograph. Reply with JSON only: a list with one object for each receipt, in the form {"box_2d": [ymin, xmin, ymax, xmax], "label": "receipt"}, where the four numbers are normalised to 0-1000.
