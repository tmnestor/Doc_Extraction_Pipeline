# The conda environment both models run in: vLLM 0.29.0.
#
#   conda env create -f conda_envs/vllm_env4.yaml
#   conda activate vllm_env4
#
# entrypoint.sh starts every task in it (DOC_EXTRACT_CONDA_ENV names another).
#
# The pins
#   Every pin is the one requirements/cuda.txt gives at the v0.29.0 tag of vLLM, and each resolved as
#   written when the environment was built on the sandbox (22 September 2026): vllm 0.29.0,
#   torch 2.13.0+cu130, torchvision 0.28.0+cu130, torchaudio 2.11.0+cu130, flashinfer-python 0.6.18.
#   torch, torchvision and torchaudio are pinned exactly and must install together from one CUDA
#   build, or vLLM will not load. torchaudio at 2.11.0 is what that tag pins, not an oversight.
#   Python is 3.12: the code uses the type statement.
#
# CUDA 13
#   The stack is built for CUDA 13.0, and torch reports cuda 13.0 on the sandbox. The L4 cards there,
#   on driver 580, support it. Check nvidia-smi on any other cards before assuming they do.
#
# No other package index
#   Do not add --index-url or --extra-index-url. Everything here installs from PyPI.
#
# flashinfer-cubin is absent, and that is the supported arrangement
#   The pre-compiled FlashInfer kernels left PyPI at 0.6.14, and are published since only on
#   flashinfer.ai's own index. Pinning the last PyPI release, 0.6.13, against flashinfer-python
#   0.6.18 would pair kernels with a runtime of another version. vLLM's own setup leaves the package
#   out of its requirements, so leaving it out here is what vLLM supports.
#   The cost: FlashInfer compiles its kernels the first time they are used, so the first engine start
#   in a new environment is slow. That is start-up and not reading, and a stage reports the two apart.
#   The compiled kernels are kept under the user's cache folder, which must be writable.
#   entrypoint.sh sets VLLM_USE_FLASHINFER_SAMPLER=0 for a related reason, given there.
#
# flash-attn is not installed separately: vLLM brings its own attention kernels.
#
# To check an environment, on a node with or without cards:
#   python -c "
#   import vllm, torch, torchvision, torchaudio, flashinfer
#   print('vllm       ', vllm.__version__)
#   print('torch      ', torch.__version__, 'cuda', torch.version.cuda)
#   print('torchvision', torchvision.__version__)
#   print('torchaudio ', torchaudio.__version__)
#   print('flashinfer ', flashinfer.__version__)
#   print('cards      ', torch.cuda.device_count())
#   "
#
# How this file came to these pins, and the comparison it was first built for, is in the decisions
# notes kept with the evaluation.

name: vllm_env4
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24.0
  - libstdcxx-ng>=12      # provides CXXABI_1.3.15+ for ICU/sqlite3

  - pip:
      # The torch family, from PyPI, at the versions requirements/cuda.txt gives at the
      # v0.29.0 tag. Do not add --index-url here: no other index is to be used.
      - torch==2.13.0
      - torchvision==0.28.0
      - torchaudio==2.11.0

      # vLLM and its most version-sensitive hard dep. Listed explicitly (even
      # though transitive) so an accidental later `pip install --upgrade` of
      # flashinfer cannot silently break vLLM.
      # flashinfer-cubin is NOT here: it left PyPI at 0.6.14 and vLLM excludes
      # it from its own requirements. See the header.
      - vllm==0.29.0
      - flashinfer-python==0.6.18

      # The loader of the Gemma W4A16 checkpoints, pinned explicitly so that a later
      # upgrade of another package cannot move the quantisation path
      # under a run.
      - compressed-tensors==0.17.0

      # For analysis and charts: not needed by vLLM.
      - pandas
      - seaborn
