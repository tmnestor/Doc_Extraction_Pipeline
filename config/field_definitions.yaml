# What the pipeline knows about documents: the document types, and how fields are scored.
#
# A DOCUMENT TYPE IS A BLOCK HERE AND A PROMPT OF THE SAME NAME in prompts/extraction_prompts.yaml.
# Nothing in Python names a type. To add one, add its block and its prompt; to have pages classified
# as it, add a rule to prompts/document_type_detection.yaml.
#
# A type's block holds:
#   fields             the fields its prompt asks for, which are the fields it is scored on
#   also_called        optional: other names a reply may give the type in its DOCUMENT_TYPE field;
#                      each is settled to the type's own name when the reply is cleaned
#   completion_tokens  optional: a fixed completion budget for a page of this type. Without it the
#                      budget is worked out from the number of fields
#   table              optional: for a type whose list fields are the columns of one table, an entry
#                      a row. Before scoring, on each side, the rows marked NOT_FOUND in the column
#                      `rows_absent_where_not_found_in` are dropped, and the rows are put in the date
#                      order of the column `rows_in_date_order_of`. Either key may be left out

document_types:
  invoice:
    also_called:
      - invoice
      - tax invoice
      - bill
      - estimate
      - quote
      - quotation
      - proforma invoice
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  receipt:
    also_called:
      - receipt
      - purchase receipt
      - sales receipt
      - transaction receipt
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT

  bank_statement:
    also_called:
      - statement
      - bank statement
      - account statement
      - credit card statement
    # A statement's reply is one long table, so its budget is fixed, not worked out from five fields.
    completion_tokens: 4096
    # The answer key holds every row and marks a credit with NOT_FOUND in the paid column; the
    # prompt asks for debits only. One side may list rows as printed and the other by date.
    table:
      columns:
        - TRANSACTION_DATES
        - TRANSACTION_AMOUNTS_PAID
        - TRANSACTION_AMOUNTS_RECEIVED
        - LINE_ITEM_DESCRIPTIONS
        - ACCOUNT_BALANCE
      rows_absent_where_not_found_in: TRANSACTION_AMOUNTS_PAID
      rows_in_date_order_of: TRANSACTION_DATES
    fields:
      - DOCUMENT_TYPE
      - STATEMENT_DATE_RANGE
      - LINE_ITEM_DESCRIPTIONS
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID

  travel:
    also_called:
      - travel
      - travel expense
      - travel_expense
      - boarding pass
      - airline ticket
      - e-ticket
      - train ticket
      - bus ticket
      - taxi receipt
      - rideshare receipt
      - itinerary
      - flight ticket
    fields:
      - DOCUMENT_TYPE
      - PASSENGER_NAME
      - TRAVEL_MODE
      - TRAVEL_ROUTE
      - TRAVEL_DATES
      - INVOICE_DATE
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - SUPPLIER_NAME

  logbook:
    also_called:
      - logbook
      - vehicle logbook
      - vehicle_logbook
      - motor vehicle logbook
      - car logbook
      - mileage log
      - trip log
      - ato logbook
    fields:
      - DOCUMENT_TYPE
      - VEHICLE_MAKE
      - VEHICLE_MODEL
      - VEHICLE_REGISTRATION
      - ENGINE_CAPACITY
      - LOGBOOK_PERIOD_START
      - LOGBOOK_PERIOD_END
      - ODOMETER_START
      - ODOMETER_END
      - TOTAL_KILOMETERS
      - BUSINESS_KILOMETERS
      - BUSINESS_USE_PERCENTAGE
      - JOURNEY_DATES
      - JOURNEY_DISTANCES
      - JOURNEY_PURPOSES

  universal:
    # The type of a page whose classification reply cannot be read: every type's fields.
    fields:
      - DOCUMENT_TYPE
      - BUSINESS_ABN
      - SUPPLIER_NAME
      - BUSINESS_ADDRESS
      - PAYER_NAME
      - PAYER_ADDRESS
      - INVOICE_DATE
      - STATEMENT_DATE_RANGE
      - LINE_ITEM_DESCRIPTIONS
      - LINE_ITEM_QUANTITIES
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - IS_GST_INCLUDED
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID
      - PASSENGER_NAME
      - TRAVEL_MODE
      - TRAVEL_ROUTE
      - TRAVEL_DATES
      - VEHICLE_MAKE
      - VEHICLE_MODEL
      - VEHICLE_REGISTRATION
      - ENGINE_CAPACITY
      - LOGBOOK_PERIOD_START
      - LOGBOOK_PERIOD_END
      - ODOMETER_START
      - ODOMETER_END
      - TOTAL_KILOMETERS
      - BUSINESS_KILOMETERS
      - BUSINESS_USE_PERCENTAGE
      - JOURNEY_DATES
      - JOURNEY_DISTANCES
      - JOURNEY_PURPOSES

# How fields are scored.
evaluation:
  # Metric thresholds: single source of truth for common/scoring.py
  thresholds:
    fuzzy_text_match: 0.75
    phone_match_high: 0.80
    phone_match_low: 0.60
    word_overlap_high: 0.80
    word_overlap_low: 0.60
    monetary_tolerance: 0.01
    anls_threshold: 0.50
    # Edit-distance similarity required to call two TRANSACTION register
    # descriptions the same row. NOT the ANLS 0.50 floor above: that is for
    # partial credit on a scalar answer, whereas this is a boolean "is this the
    # same transaction". Measured on the 55-statement corpus, genuine
    # single-character confusions score 0.94-0.97 ('DO COASTAL CHAR' vs
    # 'DD COASTAL CHAR') while DIFFERENT transactions sharing a prefix reach
    # 0.857 ('BPAY VERRALL REF30033' vs 'BPAY VERRALL REF74032'). 0.90 sits in
    # the gap; anything at or below 0.86 credits the wrong row.
    transaction_text_similarity: 0.90

  # Field type handling
  field_types:
    monetary:
      - GST_AMOUNT
      - TOTAL_AMOUNT
      - LINE_ITEM_PRICES
      - LINE_ITEM_TOTAL_PRICES
      - TRANSACTION_AMOUNTS_PAID
      - TRANSACTION_AMOUNTS_RECEIVED
      - ACCOUNT_BALANCE
      - RECEIPT_TOTAL
      - BANK_TRANSACTION_DEBIT
      - SHARE_OF_NET_INCOME
      - FRANKING_CREDIT
      - CAPITAL_GAIN_COMPONENT

    boolean:
      - IS_GST_INCLUDED

    date:
      - INVOICE_DATE
      - STATEMENT_DATE_RANGE
      - TRANSACTION_DATES
      - LOGBOOK_PERIOD_START
      - LOGBOOK_PERIOD_END
      - JOURNEY_DATES
      - RECEIPT_DATE
      - BANK_TRANSACTION_DATE

    # Transaction list fields - trigger type-aware matching (monetary/date/text)
    #
    # LINE_ITEM_DESCRIPTIONS added 2026-08-12. It is the third index-aligned
    # column of the same bank register as TRANSACTION_DATES and
    # TRANSACTION_AMOUNTS_PAID, and _TRANSACTION_SORT_GROUPS already reordered
    # it as part of that register -- so its absence here meant the schema and
    # the sorter disagreed about what the register is. Absent, it fell to
    # Jaccard word-overlap at 0.75, which on a 3-word description fails on ANY
    # single wrong word ((n-1)/(n+1) >= 0.75 needs n >= 7).
    transaction_list:
      - TRANSACTION_DATES
      - TRANSACTION_AMOUNTS_PAID
      - TRANSACTION_AMOUNTS_RECEIVED
      - ACCOUNT_BALANCE
      - LINE_ITEM_DESCRIPTIONS
      - TRAVEL_DATES
      - JOURNEY_DATES
      - JOURNEY_DISTANCES
