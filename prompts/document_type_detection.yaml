# How a page's document type is worked out.
#
# The model is not asked for the type. It is asked the questions below, which are about things that can
# be seen on the page, and the type is worked out from its answers by the rules further down. To have a
# new document type recognised, add a rule; if no question tells it apart, add a question as well. Neither
# needs a change to Python.
#
# A question has:
#   label   the word the model puts before its answer, in capitals
#   answer  what kind of answer it is:
#             columns  the column headings of the page's table, or NONE. Exactly one question is of
#                      this kind. The rules use it through the roles its headings play (column_roles)
#             yes_no   YES or NO. A rule uses it by the label in lower case, e.g. `paid: true`
#             number   a number. Asked, and not used by a rule
#   ask     the question as the model is to read it
#
# The classification prompt is the opening line and then the questions, numbered in this order.
classification:
  opening: "Look at this document image and answer each question:"
  questions:
    # AN EXPERIMENT, NOT FOR MERGING (27 November 2026). Two questions about which way up the page is,
    # put first so that a long answer to a later question cannot crowd them out of the reply. No rule
    # uses either: the replies are read afterwards, to see whether the model can tell.
    - label: TURN
      answer: number
      ask: |
        Which way up is the printed text on this page?
        Answer 0 if it is the right way up and reads normally.
        Answer 180 if it is upside down.
        Answer 90 if the page lies on its side with the tops of
        the letters pointing to the left edge of the image.
        Answer 270 if the page lies on its side with the tops of
        the letters pointing to the right edge of the image.
        Answer with one number: 0, 90, 180 or 270.
    - label: UPRIGHT
      answer: yes_no
      ask: |
        Is the printed text the right way up, so that it can be
        read without turning the image? Answer YES or NO.
    - label: COLUMNS
      answer: columns
      ask: |
        If there is a transaction table with rows of dates,
        descriptions, and amounts, list the exact column headers
        separated by " | ".
        If there is no transaction table, write NONE.
    - label: PAID
      answer: yes_no
      ask: |
        Is there evidence that payment was completed?
        Look for: payment method, "PAID" stamp, amount tendered,
        change given, receipt number, EFTPOS/card details.
        Answer YES or NO.
    - label: ROWS
      answer: number
      ask: |
        How many line items or transaction rows are visible?
        Answer with a number.
    - label: TRAVEL
      answer: yes_no
      ask: |
        Is this a flight ticket, e-ticket, boarding pass, or
        travel itinerary (showing passenger names, flights, or travel
        legs)? Answer YES or NO.

# ============================================================================
# FROM THE ANSWERS TO THE TYPE (read by common/classification.py)
# ============================================================================
# These two blocks turn the answers into a document type.

# Semantic column roles: role -> header keywords that map to it.
# Read by common/classification.py (replaces the former
# hardcoded COLUMN_PATTERNS literal). Keywords are matched case-insensitively.
column_roles:
  date:
    - date
    - trans date
    - transaction date
    - value date
    - posting date
  description:
    - description
    - details
    - transaction
    - particulars
    - narrative
    - transaction details
    - reference
  debit:
    - debit
    - withdrawal
    - withdrawals
    - dr
    - money out
  credit:
    - credit
    - deposit
    - deposits
    - cr
    - money in
  balance:
    - balance
    - running balance
    - closing balance
  amount:
    - amount
    - transaction amount
  # Vehicle-logbook columns
  distance:
    - distance
    - distance travelled
    - km
    - kilometres
  odometer:
    - odometer
    - odometer reading
    - start odometer
    - end odometer
  purpose:
    - purpose
    - purpose of trip
    - reason
  # Itemised invoice/billing-table columns
  quantity:
    - quantity
    - qty
    - units
  unit_price:
    - unit price
    - price
    - rate
  gst:
    - gst
    - tax
    - vat

# Evidence-based classification rules, evaluated TOP-DOWN, first match wins.
# This list IS the precedence the if/elif chain in _parse_enriched used to
# hardcode. A rule fires when every condition in its `when:` clause holds,
# given the parsed evidence (which column roles are present + the PAID flag).
#   when: vocabulary -> any_roles: [...], all_roles: [...], and the label of any yes_no
#         question in lower case with true or false, e.g. paid: true, travel: false
#   (multiple keys in one `when:` are AND-ed)
# default: type assigned when NO rule matches.
#   none   -> the page gets fallback_type, of config/field_definitions.yaml
#   <TYPE> -> a hard default
classification_evidence:
  rules:
    # Bank statements: financial-ledger columns.
    - type: BANK_STATEMENT
      when: { any_roles: [debit, credit, balance] }
    # Vehicle logbooks: trip/odometer columns.
    - type: LOGBOOK
      when: { any_roles: [distance, odometer, purpose] }
    # Travel docs (flight ticket / e-ticket / boarding pass / itinerary). These
    # carry no transaction table (the model reports COLUMNS: NONE), so they are
    # undetectable from columns. The detection prompt asks a dedicated TRAVEL
    # YES/NO question instead; this rule fires on that boolean. Checked before
    # RECEIPT so a paid e-ticket stays TRAVEL rather than downgrading to RECEIPT.
    - type: TRAVEL
      when: { travel: true }
    # Payment evidence wins over an itemised table (a paid, itemised receipt
    # stays a RECEIPT), so RECEIPT is checked before INVOICE.
    - type: RECEIPT
      when: { paid: true }
    # Unpaid itemised billing table -> invoice.
    - type: INVOICE
      when: { any_roles: [gst, unit_price, quantity] }
  # No rule matched -> hard-default to INVOICE (the dominant non-bank/non-receipt
  # type). Set via remote smoke (2026-06-20): `default: none` deferred unmatched
  # docs to the keyword path and sent ~21% of the dev set to UNIVERSAL (extracted
  # with the generic 33-field prompt), dropping F1 mean 0.650 -> 0.626. INVOICE
  # restores parity (F1 mean 0.650, median 0.846) and routes them to the focused
  # invoice prompt.
  # NOTE: TRAVEL is detected from the prompt's TRAVEL YES/NO evidence field (the
  # `travel: true` rule above), NOT from columns: travel docs report COLUMNS: NONE.
  # A travel doc the model fails to flag (TRAVEL: NO) falls through to this INVOICE
  # default.
  default: INVOICE

